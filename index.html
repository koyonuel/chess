<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess vs Stockfish</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.css"/>

<style>
body{
    margin:0;
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

#board{
    width:600px;
    max-width:95vw;
    margin:auto;
}

.controls{
    margin:15px 0;
}

button, select{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    margin:5px;
    font-size:16px;
}

button{
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

#status{
    font-size:22px;
    margin:10px;
    font-weight:bold;
}

.panel{
    margin-top:20px;
    background:#2a2a2a;
    padding:15px;
    border-radius:10px;
}

#history{
    text-align:left;
    max-height:200px;
    overflow-y:auto;
}

.clock{
    font-size:20px;
    margin-bottom:15px;
}
</style>
</head>
<body>

<div class="container">

<h1>♟ Chess vs Stockfish</h1>

<div class="controls">

<select id="difficulty">
<option value="5">Easy</option>
<option value="10" selected>Medium</option>
<option value="15">Hard</option>
<option value="20">Master</option>
</select>

<button onclick="newGame()">New Game</button>
<button onclick="undoMove()">Undo</button>
<button onclick="board.flip()">Flip Board</button>

</div>

<div class="clock">
White: <span id="whiteTime">10:00</span>
|
Black: <span id="blackTime">10:00</span>
</div>

<div id="status">
Your Turn
</div>

<div id="board"></div>

<div class="panel">

<h3>Move History</h3>

<div id="history">

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.js"></script>

<script>

const game = new Chess();

const stockfish = new Worker(
'https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js'
);

let whiteSeconds = 600;
let blackSeconds = 600;

const board = Chessboard('board',{

    draggable:true,
    position:'start',

    onDragStart:function(source,piece){

        if(game.game_over()) return false;

        if(game.turn() !== 'w') return false;

        if(piece.search(/^b/) !== -1)
            return false;
    },

    onDrop:function(source,target){

        const move = game.move({
            from:source,
            to:target,
            promotion:'q'
        });

        if(move === null){
            return 'snapback';
        }

        updateHistory();
        updateStatus();

        setTimeout(makeAIMove,250);
    },

    onSnapEnd:function(){
        board.position(game.fen());
    }

});

function makeAIMove(){

    if(game.game_over()) return;

    let depth =
    document.getElementById("difficulty").value;

    stockfish.postMessage("uci");
    stockfish.postMessage(
        "position fen " + game.fen()
    );
    stockfish.postMessage(
        "go depth " + depth
    );
}

stockfish.onmessage = function(event){

    let line = event.data;

    if(line.startsWith("bestmove")){

        let move =
        line.split(" ")[1];

        if(move && move !== "(none)"){

            game.move({
                from:move.substring(0,2),
                to:move.substring(2,4),
                promotion:'q'
            });

            board.position(
                game.fen()
            );

            updateHistory();
            updateStatus();
        }
    }
};

function updateHistory(){

    const moves =
    game.history();

    let html = "";

    for(let i=0;i<moves.length;i+=2){

        html +=
            (Math.floor(i/2)+1) +
            ". " +
            moves[i] +
            " " +
            (moves[i+1] || "") +
            "<br>";
    }

    document.getElementById(
        "history"
    ).innerHTML = html;
}

function updateStatus(){

    let status = "";

    if(game.in_checkmate()){

        status =
        "🏆 Checkmate! " +
        (game.turn() === "w"
            ? "Black Wins"
            : "White Wins");

    }
    else if(game.in_draw()){

        status = "Draw!";

    }
    else{

        status =
        game.turn() === "w"
        ? "Your Turn"
        : "🤖 Stockfish Thinking...";

        if(game.in_check()){
            status += " (Check)";
        }
    }

    document.getElementById(
    "status"
    ).innerText = status;
}

function undoMove(){

    game.undo();
    game.undo();

    board.position(
        game.fen()
    );

    updateHistory();
    updateStatus();
}

function newGame(){

    game.reset();

    board.start();

    whiteSeconds = 600;
    blackSeconds = 600;

    updateClocks();
    updateHistory();
    updateStatus();
}

function updateClocks(){

    let wm =
    Math.floor(
    whiteSeconds/60
    );

    let ws =
    whiteSeconds%60;

    let bm =
    Math.floor(
    blackSeconds/60
    );

    let bs =
    blackSeconds%60;

    document.getElementById(
    "whiteTime"
    ).textContent =
    wm + ":" +
    String(ws)
    .padStart(2,"0");

    document.getElementById(
    "blackTime"
    ).textContent =
    bm + ":" +
    String(bs)
    .padStart(2,"0");
}

setInterval(() => {

    if(game.game_over())
        return;

    if(game.turn()==='w')
        whiteSeconds--;
    else
        blackSeconds--;

    updateClocks();

},1000);

updateStatus();
updateClocks();

</script>

</body>
</html>
