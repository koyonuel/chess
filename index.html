<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess</title>

<style>
body{
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#board{
    width:480px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(8,60px);
}

.square{
    width:60px;
    height:60px;
    border:none;
    font-size:40px;
    cursor:pointer;
}

.light{
    background:#f0d9b5;
}

.dark{
    background:#b58863;
}

.selected{
    outline:4px solid yellow;
}

button{
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<h1>♟ Chess</h1>

<button onclick="resetBoard()">New Game</button>

<p id="status">White to Move</p>

<div id="board"></div>

<script>
const startPos = [
"♜","♞","♝","♛","♚","♝","♞","♜",
"♟","♟","♟","♟","♟","♟","♟","♟",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"♙","♙","♙","♙","♙","♙","♙","♙",
"♖","♘","♗","♕","♔","♗","♘","♖"
];

let boardData=[...startPos];
let selected=null;

function drawBoard(){

const board=document.getElementById("board");
board.innerHTML="";

for(let i=0;i<64;i++){

const sq=document.createElement("button");

sq.className=
"square " +
(((Math.floor(i/8)+i)%2)
?"dark":"light");

if(selected===i){
sq.classList.add("selected");
}

sq.textContent=boardData[i];

sq.onclick=()=>clickSquare(i);

board.appendChild(sq);
}
}

function clickSquare(i){

if(selected===null){

if(boardData[i] !== ""){
selected=i;
}

}else{

boardData[i]=boardData[selected];
boardData[selected]="";

selected=null;

drawBoard();
}
drawBoard();
}

function resetBoard(){
boardData=[...startPos];
selected=null;
drawBoard();
}

drawBoard();
</script>

</body>
</html>
